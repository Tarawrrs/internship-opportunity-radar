<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f8">
  <meta name="description" content="台大與中研院學術活動、經濟與語言學新研究、台北和台灣可遠端的實習及研究機會。">
  <title>學術與職涯資訊中心</title>
  <link rel="stylesheet" href="./style.css?v=1">
  <script src="./app.js?v=1" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳至主要內容</a>
  <header class="header">
    <div class="shell header-inner">
      <a href="#overview" class="brand">學術與職涯<span>資訊中心</span></a>
      <nav class="nav" aria-label="主選單">
        <a href="#overview" data-nav="overview">總覽</a>
        <a href="#events" data-nav="academic">學術</a>
        <a href="#career" data-nav="career">職涯</a>
      </nav>
      <a href="#sources" class="scan-link" id="scan-link"><span class="dot" aria-hidden="true"></span><span id="scan-label">讀取掃描紀錄</span></a>
    </div>
  </header>

  <main class="shell main" id="main">
    <noscript><p class="notice">開啟 JavaScript 即可瀏覽最新活動、論文與職缺。</p></noscript>
    <p id="load-error" class="notice warn" role="status" hidden></p>
    <section id="view-overview" data-view="overview" aria-labelledby="overview-heading">
      <div class="page-heading">
        <div><h1 id="overview-heading" tabindex="-1">總覽</h1><p id="today-label"></p></div>
      </div>
      <div class="dashboard">
        <section class="panel">
          <div class="panel-heading">
            <div><h2>近期學術活動</h2><p>台大與中研院</p></div>
            <a class="section-link" href="#events">全部活動 <span aria-hidden="true">→</span></a>
          </div>
          <div id="overview-events" class="rows"></div>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <div><h2>寒假機會與截止日</h2><p id="winter-overview"></p></div>
            <a class="section-link" href="#career">全部寒假機會 <span aria-hidden="true">→</span></a>
          </div>
          <div id="overview-jobs" class="rows"></div>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <div><h2>新研究</h2><p>期刊與工作論文</p></div>
            <a class="section-link" href="#papers">全部研究 <span aria-hidden="true">→</span></a>
          </div>
          <div id="overview-papers" class="rows"></div>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <div><h2>最近發現的職缺</h2><p>雷達首次找到的日期</p></div>
            <a class="section-link" href="#career-new">近七天 <span aria-hidden="true">→</span></a>
          </div>
          <div id="overview-new" class="rows"></div>
        </section>
      </div>
    </section>

    <section id="view-academic" data-view="academic" aria-labelledby="academic-heading" hidden>
      <div class="page-heading">
        <div><h1 id="academic-heading" tabindex="-1">學術</h1><p>台大與中研院活動 · 經濟與語言學研究</p></div>
      </div>
      <nav class="subnav" aria-label="學術分類">
        <a href="#events" data-academic="events">活動與演講</a>
        <a href="#papers" data-academic="papers">新研究</a>
      </nav>
      <div class="filters" role="search" aria-label="篩選學術資訊">
        <label class="search"><span>搜尋</span><input type="search" id="academic-query" placeholder="標題、講者、作者或主題"></label>
        <label><span>主題</span><select id="academic-topic"><option value="">全部主題</option></select></label>
        <label id="institution-filter"><span>機構</span><select id="academic-institution"><option value="">全部機構</option><option>台大</option><option>中研院</option></select></label>
        <label id="paper-type-filter" hidden><span>出版類型</span><select id="academic-paper-type"><option value="">全部類型</option><option>工作論文</option><option>期刊紀錄</option></select></label>
      </div>
      <div class="results-head"><h2 id="academic-list-heading">近期活動</h2><span id="academic-count" aria-live="polite"></span></div>
      <div id="academic-list" class="panel rows"></div>
      <button id="more-papers" type="button" class="button more" hidden>顯示更多研究</button>
    </section>

    <section id="view-career" data-view="career" aria-labelledby="career-heading" hidden>
      <div class="page-heading">
        <div><h1 id="career-heading" tabindex="-1">職涯</h1><p>台北實體／混合辦公，或可從台灣全遠端</p></div>
      </div>
      <div class="filters career-filters" role="search" aria-label="篩選職缺">
        <label class="search"><span>搜尋</span><input type="search" id="job-query" placeholder="職稱、雇主或技能"></label>
        <label><span>職務類型</span><select id="job-track"><option value="">全部類型</option><option value="research">研究型</option><option value="business">商業型</option></select></label>
        <label><span>實習期間</span><select id="job-season">
          <option value="winter">寒假機會</option><option value="winter-only">寒假限定</option>
          <option value="extends">寒假開始、延續到學期</option><option value="flexible">起聘或結束日待確認</option>
          <option value="all">所有期間</option>
        </select></label>
        <label><span>工作位置</span><select id="job-location"><option value="">全部位置</option><option value="taipei">台北</option><option value="remote">台灣可全遠端</option></select></label>
        <label><span>清單</span><select id="job-state">
          <option value="active">目前機會</option><option value="new">近七天新發現</option><option value="review">待查核</option>
          <option value="saved">收藏</option><option value="applied">已申請</option><option value="dismissed">已略過</option>
          <option value="archive">Archive／歷史紀錄</option>
        </select></label>
        <label><span>排序</span><select id="job-sort"><option value="deadline">截止日優先</option><option value="new">新發現優先</option><option value="fit">契合度優先</option></select></label>
      </div>
      <p class="filter-note" id="career-note"></p>
      <div class="results-head"><h2 id="job-list-heading">目前機會</h2><span id="job-count" aria-live="polite"></span></div>
      <div id="job-list" class="job-list"></div>
    </section>

    <section id="view-sources" data-view="sources" aria-labelledby="sources-heading" hidden>
      <div class="page-heading">
        <div><h1 id="sources-heading" tabindex="-1">來源與掃描紀錄</h1><p>GitHub Actions 每天排程一次（台北時間 21:57）。</p></div>
        <button class="button" id="reload" type="button">讀取已發布的資料</button>
      </div>
      <div id="source-scan-summary" class="panel scan-summary"></div>
      <div class="dashboard sources-grid">
        <section class="panel">
          <div class="panel-heading"><h2>職涯來源</h2></div>
          <div id="job-sources" class="rows"></div>
        </section>
        <section class="panel">
          <div class="panel-heading"><h2>學術來源</h2></div>
          <div id="academic-sources" class="rows"></div>
        </section>
      </div>
    </section>
    <p id="feedback" class="feedback" role="status" hidden></p>
  </main>
  <footer class="shell footer">
    <a href="#sources">來源與掃描紀錄</a>
    <a href="https://github.com/Tarawrrs/internship-opportunity-radar">GitHub</a>
    <span>時間以台北時區顯示</span>
  </footer>
</body>
</html>
